<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home Assistant App</title>
<style>

/* ======================================
 global box-sizing and styles 
====================================== */

* {
    box-sizing: border-box;
}

:root {
    --bg: #121212;
    --panel: #1a1a1a;
    --text: #ffffff;
}

.light {
    --bg: #f5f5f5;
    --panel: #e6e6e6;
    --text: #000000;
}

body {
    /* display/box */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    /* visuals */
    background: #11111155;
    /* text */
    font-family: 'Arial', sans-serif;
}

/* ======================================
 layout or full page structure 
====================================== */

/* outside border for all pages to simulate device frame */
.frame {
    /* position */
    position: relative;
    /* box */
    width: 820px;
    height: 500px;
    border-radius: 30px;
    padding: 20px;
    /* visuals */
    background: #000;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
}


/* idle/sleep screen */
.sleep {
    /* position */
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 20px;
    /* display/box */
    display: flex;
    flex-direction: column;
    gap: 10px;
    /* visuals */
    background: linear-gradient(-45deg, #192025f5, #111111, #1a1a1a, #1b171f, #0a0a0a);
    animation: flow 30s ease-in-out infinite;
    background-size: 200% 200%;
    color: white;
    /* text */
    font-size: 40px;
}

#wake {
    /* text */
    font-size: 20px;
    opacity: 0.5;
}

#clock, #menuClock {
    /* display/box */
    margin-bottom: 5px;
    /* text */
    font-size: 80px;
    opacity: 0.8;
}

#sleepWeather {
    /* display/box */
    margin-bottom: 4px;
    /* text */
    font-size: 40px;
    opacity: 0.7;
}

/* main home page */
.UI {
    /* position */
    position: relative;
    /* display/box */
    height: 100%;
    /* visuals */
    background: var(--bg);
    overflow: hidden;
    transition: opacity 0.3s ease-out;
    /* text */
    color: var(--text);
}

.top {
    /* position */
    height: 50px;
    /* display/box */
    display: flex;
    justify-content: space-between;
    align-items: center;
}


/* ======================================
 Reusable components
====================================== */
.options {
    /* display/box */
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 30px;
}

.tile {
    /* display/box */
    border-radius: 15px;
    padding: 20px;
    /* visuals */
    background: var(--panel);
    border: none;
    /* text */
    font-size: 20px;
    color: var(--text);
}

.button {
    /* visuals */
    background: none;
    border: none;
    color: var(--text);
    /* text */
    font-size: 24px;
}

.openedmenu {
    /* position */
    position: absolute;
    top: 0;
    left: 0;
    /* display/box */
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    /* visuals */
    background: var(--bg);
    transition: transform 0.3s ease-out;
    /* text */
    color: var(--text);
}

/* state for hiding menus */
.hiddenMenu {
    /* position*/
    transform: translateX(100%);
    /* visuals */
    pointer-events: none;
}

.flex-center {
    /* display/box */
    display: flex;
    justify-content: center;
    align-items: center;
}

.flex-column {
    /* display/box */
    display: flex;
    flex-direction: column;
    
}

.card {
    /* display/box */
    border-radius: 20px;
    padding: 20px;
}

.interactive {
    /* visuals */
    cursor: pointer;
    transition: background 0.2s ease-out, opacity 0.2s ease-out;
}

/*=======================
 specific components
========================*/

/* weather menu */
#weatherMenu {
    /* visuals */
    background: linear-gradient(145deg, #293553, #3b3753);

}

#weatherMenuContent {
    /* display/box */
    width: 100%;
    height: calc(100% - 50px);
    margin-top: 15px;
}

.weatherContent {
    /* display/box */
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    height: 80%;
    /* text */
    text-align: center;
}

.weather-card {
    /* position */
    position: relative;
    /* display/box */
    display: flex;
    width: 100%;
    max-width: none;
    padding: 25px;
    border-radius: 20px;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    /* visuals */
    background: var(--bg);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    opacity: 0.7;
}

.weather-main {
    /* display/box */
    flex: 1;
    display: flex;
    flex-direction: column;
}

.weather-side {
    /* display/box */
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    /* text */
    text-align: left;
    font-size: 20px;
}

.weather-decoration {
    /* position */
    position: absolute;
    bottom: -40px;
    left: -20%;
    width: 300%;
    height: 75px;
    /* visuals */
    background: radial-gradient(circle, rgba(255, 255, 255, 0.1), transparent 70%);
    animation: flow2 20s ease-in-out infinite;
    filter: blur(20px);
    pointer-events: none;
}

.weather-icon {
    /* text */
    font-size: 50px;
    margin-bottom: 10px;
}

.weather-temp {
    /* text */
    font-size: 40px;
    margin-bottom: 5px;
}

.clockSections {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}

#clockMenuContent {
    margin-top: 20px;
    text-align: center;
    font-size: 20px;
}

input {
    /* display/box */
    padding: 10px;
    border-radius: 10px;
    margin: 10px 0;
    border: none;
    /* text */
    font-size: 18px;
}

.gesture-item {
    margin: 15px 0;
    padding: 15px;
    background: var(--panel);
    border-radius: 10px;
}

.gesture-item h4 {
    margin: 0 0 10px 0;
    color: var(--text);
}

.gesture-item button {
    margin-top: 10px;
    padding: 8px 15px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

/* hidden only for sleep menu */
.hidden {
    display: none;
}
/*=======================
 animations
========================*/


/* animation for weather decoration */
@keyframes flow2 {
    0% { transform: translateX(-10%) scale(1); opacity: 0.5; }
    50% { transform: translateX(10%) scale(1.1); opacity: 0.7; }
    100% { transform: translateX(-10%) scale(1); opacity: 0.5; }
}

/* animation keyframes for sleep screen */
@keyframes flow {
    0% { background-position: 0% 50%; }
    25% { background-position: 50% 100%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 50% 0%; }
    100% { background-position: 0% 50%; }
}

</style>
</head>

<body>

<div class="frame">

    <div class="sleep flex-center card" id="sleepscreen">
        
        <div class="flex-center">
            <div id="clock">00:00:00</div>
        </div>

        <div id="sleepWeather"></div>
        

        <div id="wake">tap to wake</div>
    </div>

    <div class="UI card hidden" id="UIScreen">

        <div class="top">
            <h2 id="uiClock">00:00</h2>
            <h2>Show and Tell</h2>
            <button class="button interactive
            " onclick="toggleMenu('settingsMenu')">⚙️</button>
        </div>

        <div class="options">
            <button class="tile interactive" onclick="toggleMenu('lightsMenu')">💡 Lights</button>
            <button class="tile interactive" onclick="toggleMenu('audioMenu')">🔊 Audio</button>
            <button class="tile interactive" onclick="toggleMenu('gesturesMenu')">🤖 Gestures</button>
            <button class="tile interactive" onclick="toggleMenu('weatherMenu')">🌤️ Weather</button>
            <button class="tile interactive" onclick="toggleMenu('clockMenu')">⏰ Clock</button>
        </div>

        <div class="openedmenu card hiddenMenu" id="settingsMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('settingsMenu')">←</button>
                <h2>Settings</h2>
            </div>

            <div id="settingsContent">
                <h3>Brightness</h3>
                <input type="range" min="20" max="100" value="100" id="brightnessSlider">

                <h3>Theme (Light / Dark)</h3>
                <input type="range" min ="0" max="1" value="1" step="1" id="themeSlider">

                <h3>Sound (Off / On)</h3>
                <input type="range" min ="0" max="1" value="1" step="1" id="soundSlider">
            </div>
        </div>

        <div class="openedmenu card hiddenMenu" id="lightsMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('lightsMenu')">←</button>
                <h2>Lights</h2>
            </div>
        </div>

        <div class="openedmenu card hiddenMenu" id="audioMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('audioMenu')">←</button>
                <h2>Audio</h2>
            </div>
        </div>

        <div class="openedmenu card hiddenMenu" id="gesturesMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('gesturesMenu')">←</button>
                <h2>Gesture Commands</h2>
            </div>
            <div id="gesturesContent">
                <h3>Configure Non-Verbal Commands</h3>
                <div id="gestureList"></div>
                <button class="tile interactive" onclick="loadGestures()">Load Current Commands</button>
            </div>
        </div>

        <div class="openedmenu card hiddenMenu" id="weatherMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('weatherMenu')">←</button>
                <h2>Weather</h2>
            </div>

            <div id="weatherMenuContent" class="weatherContent"></div>
        </div>

        <div class="openedmenu card hiddenMenu" id="clockMenu">
            <div class="top">
                <button class="button interactive" onclick="toggleMenu('clockMenu')">←</button>
                <h2>Clock</h2>
            </div>

            <div class="flex-center" id="menuClock">00:00:00</div>

            <div class="clockSections">
                <button class="tile interactive" onclick="showClockTab('alarms')">⏰ Alarms</button>
                <button class="tile interactive" onclick="showClockTab('stopwatch')">⏱️ Stopwatch</button>
                <button class="tile interactive" onclick="showClockTab('timer')">⏲ Timer</button>
            </div>

            <div id="clockMenuContent"></div>            
        </div>

    </div>
</div>

<script>

const sleepscreen = document.getElementById('sleepscreen');
const UIScreen = document.getElementById('UIScreen');
const clock = document.getElementById('clock');
const uiClock = document.getElementById('uiClock')
sleepscreen.addEventListener('click', () => {
    sleepscreen.classList.add('hidden');
    UIScreen.classList.remove('hidden');

    sleepTimer();
});

function updateClock() {
    const now = new Date();
    const fulltime = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit'
    });

    const shorttime = now.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit'
    });

    clock.textContent = fulltime;
    menuClock.textContent = fulltime;
    uiClock.textContent = shorttime;
}

setInterval(updateClock, 1000);
updateClock();

let sleepTimeout;
const sleepDelay = 25000;

function sleep() {
    UIScreen.classList.add('hidden');
    sleepscreen.classList.remove('hidden');
}

function sleepTimer() {
    if (!UIScreen.classList.contains('hidden')) {
        clearTimeout(sleepTimeout);
        sleepTimeout = setTimeout(sleep, sleepDelay);
    }
    
}

document.addEventListener('keydown', sleepTimer);
document.addEventListener('click', sleepTimer);

/* ============================
 Weather API Integration
============================ */

const sleepWeather = document.getElementById('sleepWeather');

const LAT = 32.5093;
const LON = -92.1193;

function getWeather(code) {
    if (code === 0) return "☀️";
    if ([1, 2, 3].includes(code)) return "⛅";
    if ([45, 48].includes(code)) return "🌫️";
    if ([51, 53, 55, 56, 57].includes(code)) return "🌦️"
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "🌧️";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "❄️";
    if ([95, 96, 99].includes(code)) return "⛈️";
}

function getWeatherDescription(code) {
    if (code === 0) return "Clear Skies";
    if ([1, 2, 3].includes(code)) return "Partly Cloudy";
    if ([45, 48].includes(code)) return "Foggy";
    if ([51, 53, 55, 56, 57].includes(code)) return "Light Rain";
    if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return "Rain";
    if ([71, 73, 75, 77, 85, 86].includes(code)) return "Snow";
    if ([95, 96, 99].includes(code)) return "Storming";
}

async function updateWeather() {
    sleepWeather.textContent = "loading..."
    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=temperature_2m,relative_humidity_2m,uv_index,visibility,weather_code,wind_speed_10m&current=temperature_2m,relative_humidity_2m,uv_index,visibility,weather_code,wind_speed_10m&timezone=auto`);
    const data = await response.json();
    const current = data.current ?? data.current_weather;
    const weatherCode = current.weather_code ?? current.weathercode;
    const weatherTemp = Math.round((current.temperature_2m ?? current.temperature) * 9/5 + 32);
    const wind = current.wind_speed_10m ?? current.windspeed;

    const hours = data.hourly.time.length - 1;
    const humidity = data.hourly.relative_humidity_2m[hours];
    const uv = data.hourly.uv_index[hours];
    const visibility = Math.round(data.hourly.visibility[hours] / 1000)
    const emoji = getWeather(weatherCode);
    
    sleepWeather.textContent = `${emoji} ${weatherTemp}°F`;

    const weatherMenu = document.getElementById('weatherMenuContent');
    if (weatherMenu) {
        weatherMenu.innerHTML = `
            <div class="weather-card">
                <div class="weather-main">
                    <div class="weather-icon">${emoji}</div>
                    <div class="weather-temp">${weatherTemp}°F</div>
                    <div class="weather-description">${getWeatherDescription(weatherCode)}</div>
                </div>

                <div class="weather-side">
                    <div class="weather-wind">🍃Wind: ${wind} mph</div>
                    <div class="weather-humidity">💧Humidity: ${humidity}%</div>
                    <div class="weather-uv">☀️UV Index: ${uv}</div>
                    <div class="weather-visibility">👁️Visibility: ${visibility} km</div>
                </div>

                <div class="weather-decoration"></div>
            </div>
        `;
    }
}

updateWeather();
setInterval(updateWeather, 300000);

/* ============================
 Clock Menu
============================ */

function showClockTab(tab) {
    const container = document.getElementById('clockMenuContent');

    if (tab === 'alarms') {
        container.innerHTML = `
            <h3>Alarms</h3>
            <input id="alarmInput" type="time" />
            <button onclick="setAlarm()">Set Alarm</button>
            <div id="alarmList"></div>
        `;
    } else if (tab === 'stopwatch') {
        container.innerHTML = `
            <h3>Stopwatch</h3>
            <div id="stopwatchDisplay">00:00:00</div>
            <button onclick="startStopwatch()">Start</button>
            <button onclick="stopStopwatch()">Stop</button>
            <button onclick="resetStopwatch()">Reset</button>
        `;
    } else if (tab === 'timer') {
        container.innerHTML = `
            <h3>Timer</h3>
            <input id="timerInput" type="number" placeholder="Seconds" />
            <button onclick="startTimer()">Start Timer</button>
            <div id="timerDisplay"></div>
        `;
    }
}

/* clock logic */
let timerInterval;

function startTimer() {
    const seconds = parseInt(document.getElementById('timerInput').value);
    const display = document.getElementById('timerDisplay');

    clearInterval(timerInterval);

    let time = seconds;

    timerInterval = setInterval(() => {
        if (time <= 0) {
            clearInterval(timerInterval);
            display.textContent = "Timer Finished!";
        } else {
            display.textContent = `Time Remaining: ${time}s`;
            time--;
        }
    }, 1000);
}

let stopwatchInterval;
let stopwatchTime = 0;
let running = false;

function startStopwatch() {
    if (running) return;
    running = true;
        
    stopwatchInterval = setInterval(() => {
        stopwatchTime++;
        const hours = String(Math.floor(stopwatchTime / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((stopwatchTime % 3600) / 60)).padStart(2, '0');
        const seconds = String(stopwatchTime % 60).padStart(2, '0');
        document.getElementById('stopwatchDisplay').textContent = `${hours}:${minutes}:${seconds}`;
    }, 1000);
}

function stopStopwatch() {
    running = false;
    clearInterval(stopwatchInterval);
}

function resetStopwatch() {
    stopStopwatch();
    stopwatchTime = 0;
    document.getElementById('stopwatchDisplay').textContent = "00:00:00";
}

let alarmTime = null;
let alarmInterval;

function setAlarm() {
    alarmTime = document.getElementById('alarmInput').value;

    clearInterval(alarmInterval);

    alarmInterval = setInterval(() => {
        const now = new Date();
        const current = now.toTimeString().slice(0, 5);

        if (current === alarmTime) {
            alert("Alarm ringing!");
            clearInterval(alarmInterval);
        }
    }, 1000);
}

/* ============================
 Settings Logic
============================ */

const brightnessSlider = document.getElementById('brightnessSlider');
const themeSlider = document.getElementById('themeSlider');
const soundSlider = document.getElementById('soundSlider');

const theme = document.querySelector('.UI');

brightnessSlider.addEventListener('input', () => {
    const brightness = brightnessSlider.value;
    document.querySelector('.frame').style.filter = `brightness(${brightness}%)`;
});

themeSlider.addEventListener('input', () => {

        if (themeSlider.value == 0) {
            document.body.classList.add('light')
        } else {
            document.body.classList.remove('light')
            }
});

let SoundOn = true;

soundSlider.addEventListener('input', () => {
        SoundOn = soundSlider.value == 1;
});

/* ============================
 Gesture Commands Logic
============================ */

async function loadGestures() {
    try {
        const response = await fetch('/get_commands');
        const commands = await response.json();
        
        const gestureList = document.getElementById('gestureList');
        gestureList.innerHTML = '';
        
        for (const [gesture, command] of Object.entries(commands)) {
            const div = document.createElement('div');
            div.className = 'gesture-item';
            div.innerHTML = `
                <h4>${gesture.charAt(0).toUpperCase() + gesture.slice(1)} Gesture</h4>
                <input type="text" value="${command}" id="cmd-${gesture}" />
                <button onclick="updateGesture('${gesture}')">Update</button>
            `;
            gestureList.appendChild(div);
        }
    } catch (error) {
        console.error('Failed to load gestures:', error);
    }
}

async function updateGesture(gesture) {
    const command = document.getElementById(`cmd-${gesture}`).value;
    try {
        const response = await fetch('/update_command', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ gesture, command })
        });
        const result = await response.json();
        if (result.status === 'success') {
            alert('Command updated successfully!');
        } else {
            alert('Failed to update command');
        }
    } catch (error) {
        console.error('Failed to update gesture:', error);
    }
}

/* ============================
 Menu Toggle Logic
============================ */

function toggleMenu(menuID) {
    const target = document.getElementById(menuID);

    target.classList.toggle('hiddenMenu');
}


</script>
</body>
</html>
